<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>BE-IT 8x8</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="8x8">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000; --panel:#0c0c0d; --panel2:#151517; --line:#282828; --line2:#3a3a3a;
    --ink:#fff; --dim:#8c8c8c; --faint:#5c5c5c;
    --done:#fff; --go:#2fbf5b; --live:#111;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --display:"Anton",Impact,var(--font);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font)}
  body{padding:0 0 84px; max-width:640px; margin:0 auto; min-height:100vh}
  img{max-width:100%; display:block}
  h1,h2,h3{margin:0}
  .disp{font-family:var(--display); font-weight:400; text-transform:uppercase; letter-spacing:.5px;
    font-style:normal; transform:skewX(-7deg); transform-origin:left}
  .hide{display:none!important}
  .sub{color:var(--dim); font-size:13px; line-height:1.5}
  .faint{color:var(--faint)}

  /* header */
  header{position:sticky; top:0; z-index:20; background:linear-gradient(#000 82%,transparent);
    padding:16px 16px 12px; display:flex; align-items:center; justify-content:center; gap:10px}
  header img{height:64px; width:auto}
  header .adminlink{position:absolute; right:14px; top:16px; color:var(--faint); font-size:11px;
    text-transform:uppercase; letter-spacing:1px; background:none; border:0; cursor:pointer}

  .wrap{padding:6px 16px 20px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px}
  .card.tight{padding:12px}

  /* big kicker headings */
  .kick{font-family:var(--display); text-transform:uppercase; transform:skewX(-7deg); font-size:26px;
    line-height:.98; letter-spacing:.5px; margin:2px 0 10px}
  .kick.sm{font-size:20px}
  .eyebrow{color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:2px; font-weight:800; margin-bottom:6px}

  /* becoming statement block */
  .becoming{font-size:20px; line-height:1.5; font-weight:600}
  .becoming b{font-weight:800}
  .becoming .fixed{display:block; margin-top:8px; font-weight:800; font-style:italic}

  /* buttons */
  .btn{appearance:none; border:1px solid var(--ink); background:var(--ink); color:#000; font-weight:800;
    font-size:15px; padding:14px 16px; border-radius:12px; cursor:pointer; width:100%; letter-spacing:.3px}
  .btn:disabled{opacity:.35; cursor:default}
  .btn.ghost{background:transparent; color:var(--ink); border-color:var(--line2)}
  .btn.sm{width:auto; padding:8px 12px; font-size:13px; border-radius:9px}
  .btn.danger{background:transparent; color:#ff6b6b; border-color:#5a2020}

  /* selects + inputs */
  select.txt,input.txt,textarea.txt{width:100%; background:var(--panel2); color:var(--ink);
    border:1px solid var(--line2); border-radius:11px; padding:12px; font-size:15px; font-family:var(--font)}
  textarea.txt{resize:vertical; min-height:80px}
  label.fld{display:block; margin:0 0 12px}
  label.fld .lb{font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; margin:0 0 5px; display:block}

  /* habit rows */
  .hrow{display:flex; align-items:center; gap:12px; background:var(--panel2); border:1px solid var(--line);
    border-radius:12px; padding:13px 14px; margin-bottom:8px; cursor:pointer; transition:.12s}
  .hrow.on{background:#fff; border-color:#fff; color:#000}
  .hrow.on .cb{background:#000; border-color:#000; color:#fff}
  .hrow .lab{flex:1; min-width:0; font-weight:700; font-size:15px}
  .hrow .cb{flex:0 0 auto; width:28px; height:28px; border-radius:8px; border:2px solid var(--line2);
    display:grid; place-items:center; font-size:16px; font-weight:900; color:transparent}
  .hrow .tag{font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--faint); font-weight:800}
  .hrow.on .tag{color:#555}
  .hrow.locked{opacity:.55; cursor:default}
  .hrow.pick.on{background:var(--panel2); border-color:#fff; color:var(--ink)}
  .hrow.pick.on .cb{background:#fff; border-color:#fff; color:#000}

  .divlab{font-size:11px; text-transform:uppercase; letter-spacing:2px; color:var(--faint); font-weight:800; margin:16px 0 8px}

  /* stat tiles */
  .stat{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px}
  .stat .b{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; text-align:center}
  .stat .n{font-family:var(--display); font-size:34px; transform:skewX(-7deg); line-height:1}
  .stat .l{font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:1.5px; margin-top:6px; font-weight:800}

  /* leaderboard */
  table{width:100%; border-collapse:collapse}
  th{font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); text-align:left; padding:6px 8px; font-weight:800}
  td{padding:11px 8px; border-top:1px solid var(--line); font-size:15px}
  td.num{text-align:right; font-weight:800; font-variant-numeric:tabular-nums}
  tr.me td{background:#fff; color:#000}
  tr.me td:first-child{border-radius:10px 0 0 10px} tr.me td:last-child{border-radius:0 10px 10px 0}
  .rankmed{font-family:var(--display); transform:skewX(-7deg); display:inline-block}

  /* pills / notes */
  .note{background:var(--panel2); border:1px solid var(--line2); border-radius:12px; padding:11px 13px; font-size:13px; color:var(--dim)}
  .note.warn{border-color:#5a4a1a; color:#e8c877; background:#191509}
  .pts{font-family:var(--display); transform:skewX(-7deg); display:inline-block}

  /* bottom nav */
  nav.tabs{position:fixed; bottom:0; left:0; right:0; z-index:30; display:flex; max-width:640px; margin:0 auto;
    background:#070707; border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom)}
  nav.tabs button{flex:1; background:none; border:0; color:var(--faint); padding:12px 4px 14px; cursor:pointer;
    font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:1.5px; display:flex; flex-direction:column; align-items:center; gap:4px}
  nav.tabs button .i{font-size:19px; line-height:1}
  nav.tabs button.on{color:var(--ink)}

  /* toast */
  .toast{position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(20px); z-index:50;
    background:#fff; color:#000; font-weight:800; font-size:13px; padding:10px 16px; border-radius:999px;
    opacity:0; pointer-events:none; transition:.18s}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  /* splash / gate */
  .center{min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px}
  .center img.tl{width:82%; max-width:360px; margin:18px 0}

  /* tick strike-through */
  .hrow.on .lab{text-decoration:line-through; text-decoration-thickness:2px}

  /* day counter + view-card pill */
  .kick.daycount{font-size:14px; color:var(--dim); letter-spacing:1.5px; margin:0 0 10px}
  .day-pill{display:inline-flex; align-items:center; gap:6px; background:var(--panel2); border:1px solid var(--line2);
    border-radius:999px; padding:9px 16px; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:1px;
    color:var(--ink); cursor:pointer; margin:0 0 14px; appearance:none}

  /* day-complete card */
  #view-complete{position:fixed; inset:0; z-index:200; background:#000; overflow-y:auto; display:flex;
    align-items:flex-start; justify-content:center; padding:70px 20px 40px}
  #view-complete.hide{display:none!important}
  .cmpl-close,.cmpl-share{position:fixed; top:18px; width:38px; height:38px; border-radius:50%; border:1px solid var(--line2);
    background:var(--panel2); color:var(--ink); display:grid; place-items:center; font-size:16px; cursor:pointer; padding:0; z-index:201}
  .cmpl-close{left:18px} .cmpl-share{right:18px}
  .cmpl-card{max-width:420px; width:100%; text-align:center}
  .cmpl-title{font-family:var(--display); text-transform:uppercase; transform:skewX(-7deg); font-size:36px; line-height:1.05}
  .cmpl-sub-img{width:66%; max-width:230px; margin:6px auto 0}
  .cmpl-quote{font-size:15px; line-height:1.55; color:var(--ink); font-weight:600; font-style:italic; margin:26px 0 4px; padding:0 10px}
  .cmpl-grid{display:flex; flex-direction:column; gap:7px; margin-top:26px; align-items:center}
  .cmpl-grid .wk{display:flex; gap:7px}
  .cmpl-grid .d{width:22px; height:22px; border-radius:6px; border:1.5px solid var(--line2)}
  .cmpl-grid .d.perfect{background:#fff; border-color:#fff}
  .cmpl-grid .d.partial{background:#4a4a4a; border-color:#7a7a7a}
  .cmpl-grid .d.missed{background:transparent; border-color:var(--line2)}
  .cmpl-grid .d.future{background:transparent; border-color:var(--line2)}
  .cmpl-grid .d.today{box-shadow:0 0 0 2px #fff}
  .cmpl-foot{margin-top:22px; font-size:11px; color:var(--faint); text-transform:uppercase; letter-spacing:1.5px; font-weight:800}
</style>
</head>
<body>
  <header>
    <img src="logo.png" alt="BE-IT 8x8" id="logoImg">
    <button class="adminlink" id="adminBtn" title="Admin">admin</button>
  </header>

  <div id="view-gate"   class="hide"></div>
  <div id="view-setup"  class="hide"></div>
  <div id="view-home"   class="hide"></div>
  <div id="view-board"  class="hide"></div>
  <div id="view-admin"  class="hide"></div>
  <div id="view-complete" class="hide"></div>

  <nav class="tabs hide" id="tabs">
    <button data-tab="home" class="on"><span class="i">🏠</span>Today</button>
    <button data-tab="board"><span class="i">🏆</span>Leaderboard</button>
  </nav>

  <div class="toast" id="toast">Saved</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
